  <main class="auth-container">
    <h1 class="section-title">Login</h1>
    
    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" minlength="10" maxlength="50" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" maxlength="12" required>
      </div>

      <button type="submit" class="submit-btn">Login</button>
      
      <p class="text-center">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </form>

    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/helper.js"></script>
    <script>
      // Remove login/register from nav when on login page
      document.addEventListener('DOMContentLoaded', () => {
        const authLinks = document.querySelector('.auth-links');
        if (authLinks) {
          authLinks.remove();
        }
      });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        alert('Please fill in all fields');
        return;
      }

      try {
        await window.apiRequest('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        const redirect = new URLSearchParams(window.location.search).get('redirect');
        let safeRedirect = 'index.html';
        if (redirect) {
          try {
            const candidate = new URL(redirect, window.location.href);
            if (candidate.origin === window.location.origin && /\/pages\/[^/]+\.html$/.test(candidate.pathname)) {
              safeRedirect = candidate.href;
            }
          } catch {
            safeRedirect = 'index.html';
          }
        }
        window.location.href = safeRedirect;
      } catch (error) {
        alert(error.message);
      }
    });
  </script>
